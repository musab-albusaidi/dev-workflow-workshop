# CD: "promote the SAME commit through uat -> prod".
#
# dev is not deployed: it is your project folder + a local Postgres.
#
# Starts automatically when CI passes on main (i.e. after a PR is merged).
#   uat  : deploys straight away to the uat VM
#   prod : waits for a human to approve (GitHub Environment "prod")
#   then : tags the commit as a release (v1.0.0, v1.1.0, ...)
#
# Rollback / redeploy: Actions -> CD -> "Run workflow", enter an older tag.
#
# Every job runs on GitHub-hosted runners. The deploy jobs reach each Azure VM
# over SSH as the 'deploy' user, whose key can only run workshop-receive
# (see scripts/ship.sh). They never run for pull requests or forks.
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit SHA to deploy (e.g. v1.0.0 for a rollback)"
        required: true

permissions:
  contents: read

# Never run two promotions at the same time.
concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  resolve:
    name: Pick the commit to promote
    # Only promote CI runs that passed for a push to main in THIS repo
    # (never a pull request, never a fork).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      is_tag: ${{ steps.pick.outputs.is_tag }}
      label: ${{ steps.pick.outputs.label }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - id: pick
        env:
          REF: ${{ inputs.ref }}
        run: |
          sha="$(git rev-parse HEAD)"
          is_tag=false
          if [ -n "$REF" ] && git rev-parse -q --verify "refs/tags/$REF" >/dev/null; then is_tag=true; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "is_tag=$is_tag" >> "$GITHUB_OUTPUT"
          label="$(printf %s "${REF:-main}" | tr -cd 'A-Za-z0-9._/-')"
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "### Promoting \`${sha:0:7}\` ${REF:+($REF)}" >> "$GITHUB_STEP_SUMMARY"

  deploy-uat:
    needs: resolve
    runs-on: ubuntu-latest
    environment: uat
    steps:
      # Checkout main (this workflow's commit) for the deploy tooling, with full
      # history so ship.sh can export the app code of the commit being promoted.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Ship to the uat VM
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          LABEL: ${{ needs.resolve.outputs.label }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
        run: scripts/ship.sh uat "$SHA" "$LABEL"

  deploy-prod:
    needs: [resolve, deploy-uat]
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Ship to the prod VM
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          LABEL: ${{ needs.resolve.outputs.label }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
        run: scripts/ship.sh prod "$SHA" "$LABEL"

  release:
    name: Tag the release
    needs: [resolve, deploy-prod]
    # A rollback to an existing tag doesn't need a new tag.
    if: needs.resolve.outputs.is_tag != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create next minor version
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          latest="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          if [ -z "$latest" ]; then
            next=v1.0.0
          else
            IFS=. read -r major minor _ <<< "${latest#v}"
            next="v${major}.$((minor + 1)).0"
          fi
          gh release create "$next" --target "$SHA" --title "$next" --generate-notes
          echo "### Released $next (\`${SHA:0:7}\`) to prod" >> "$GITHUB_STEP_SUMMARY"
