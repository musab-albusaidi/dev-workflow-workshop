# ONE definition of the stack, used by every environment:
#   dev  (your machine):  docker compose -p dev  --env-file infra/env/dev.env -f infra/docker-compose.yml up -d
#   uat  (uat VM):        docker compose -p uat  --env-file /opt/workshop/infra/uat.env  -f /opt/workshop/infra/docker-compose.yml up -d
#   prod (prod VM):       docker compose -p prod --env-file /opt/workshop/infra/prod.env -f /opt/workshop/infra/docker-compose.yml up -d
# scripts/envs.sh does dev for you; scripts/provision-vm.sh copies this file to the VMs.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${PG_PORT}:5432"   # only reachable from the machine itself, never the internet
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    labels:
      workshop.env: ${ENV}
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
