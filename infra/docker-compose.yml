# ONE definition of the stack. Started three times, once per environment:
#   docker compose -p dev  --env-file infra/env/dev.env  -f infra/docker-compose.yml up -d
#   docker compose -p uat  --env-file infra/env/uat.env  -f infra/docker-compose.yml up -d
#   docker compose -p prod --env-file infra/env/prod.env -f infra/docker-compose.yml up -d
# Each project gets its own container, network and volume: like three separate VMs.
# (scripts/envs.sh does this for you.)
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${PG_PORT}:5432"   # only reachable from this machine
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    labels:
      workshop.env: ${ENV}
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
